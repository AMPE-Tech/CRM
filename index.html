<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>AuraLOA CRM | Enterprise Pipeline</title>
    <style>
        :root { --gold: #D4AF37; --bg: #0a0a0a; --surface: #121212; --text: #e0e0e0; }
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; }
        
        /* Sidebar Estilo Pipedrive */
        nav { width: 80px; background: #000; height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px 0; border-right: 1px solid #333; }
        .logo { color: var(--gold); font-size: 1.5em; margin-bottom: 40px; }
        .nav-item { color: #666; margin: 20px 0; cursor: pointer; }

        /* Conteúdo Principal */
        main { flex: 1; padding: 30px; }
        .header { display: flex; justify-content: space-between; margin-bottom: 30px; }
        
        /* Kanban Layout */
        .kanban { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        .col { background: var(--surface); border-radius: 6px; padding: 15px; border-top: 4px solid var(--gold); }
        .card { background: #1a1a1a; padding: 15px; margin: 10px 0; border-radius: 4px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border: 1px solid #333; }
        .card h4 { margin: 0; color: #fff; }
        .card p { font-size: 0.8em; color: var(--gold); }
        
        /* Tabela Estilo Salesforce */
        .table-container { background: var(--surface); margin-top: 40px; padding: 20px; border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; color: #888; font-weight: 500; padding: 10px; border-bottom: 1px solid #333; }
        td { padding: 12px; border-bottom: 1px solid #222; }
    </style>
</head>
<body>

<nav>
    <div class="logo">A</div>
    <div class="nav-item">📊</div>
    <div class="nav-item">📁</div>
    <div class="nav-item">⚙️</div>
</nav>

<main>
    <div class="header">
        <h1>Pipeline de Vendas</h1>
        <button onclick="window.print()" style="background:var(--gold); border:none; padding:10px 20px; cursor:pointer;">Exportar PDF</button>
    </div>

    <div class="kanban">
        <div class="col"><h3>Prospecting</h3><div class="card"><h4>Eduardo</h4><p>R$ 22.000.000</p></div></div>
        <div class="col"><h3>Qualification</h3><div class="card"><h4>Amapá Eng.</h4><p>R$ 28.116.915</p></div></div>
        <div class="col"><h3>Due Diligence</h3></div>
        <div class="col"><h3>Fechamento</h3></div>
    </div>

    <div class="table-container">
        <h3>Detalhamento de Ativos</h3>
        <table contenteditable="true">
            <thead><tr><th>Precatório</th><th>Valor</th><th>Responsável</th><th>Status</th></tr></thead>
            <tbody>
                <tr><td>36506779</td><td>28.116.915</td><td>Marcos Costa</td><td>Ativo</td></tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
