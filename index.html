<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>AuraLOA CRM | Enterprise Pipeline</title>
    <style>
        :root { --gold: #D4AF37; --bg: #0a0a0a; --surface: #121212; --text: #e0e0e0; }
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; }
        
        /* Sidebar */
        nav { width: 80px; background: #000; height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px 0; border-right: 1px solid #333; }
        .logo { color: var(--gold); font-size: 1.5em; margin-bottom: 40px; font-weight: bold; }

        /* Conteúdo */
        main { flex: 1; padding: 30px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        
        /* Filtro */
        .filter-box { padding: 10px; border-radius: 4px; border: 1px solid #333; background: #1a1a1a; color: #fff; width: 250px; }

        /* Kanban */
        .kanban { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        .col { background: var(--surface); border-radius: 6px; padding: 15px; border-top: 4px solid var(--gold); }
        .card { background: #1a1a1a; padding: 15px; margin: 10px 0; border-radius: 4px; border-left: 4px solid var(--gold); }
        .card p { font-size: 0.8em; color: var(--gold); margin: 5px 0 0 0; }
        
        /* Tabela */
        .table-container { background: var(--surface); margin-top: 40px; padding: 20px; border-radius: 6px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; color: #888; padding: 10px; border-bottom: 1px solid #333; }
        td { padding: 12px; border-bottom: 1px solid #222; }
    </style>
</head>
<body>

<nav>
    <div class="logo">A</div>
    <div style="margin:20px 0;">📊</div>
</nav>

<main>
    <div class="header">
        <h1>Pipeline de Vendas</h1>
        <input type="text" id="respFilter" class="filter-box" placeholder="Filtrar por responsável..." onkeyup="filterKanban()">
    </div>

    <div class="kanban" id="board">
        <div class="col" data-resp="Marcos"><h3>Prospecting</h3>
            <div class="card" data-resp="Marcos"><h4>Eduardo</h4><p>Responsável: Marcos</p></div>
        </div>
        <div class="col" data-resp="Francielle"><h3>Qualification</h3>
            <div class="card" data-resp="Francielle"><h4>Amapá Eng.</h4><p>Responsável: Francielle</p></div>
        </div>
        <div class="col"><h3>Due Diligence</h3></div>
        <div class="col"><h3>Fechamento</h3></div>
    </div>
</main>

<script>
function filterKanban() {
    let input = document.getElementById('respFilter').value.toLowerCase();
    let cards = document.getElementsByClassName('card');
    for (let card of cards) {
        let resp = card.getAttribute('data-resp').toLowerCase();
        card.style.display = resp.includes(input) ? "" : "none";
    }
}
</script>
</body>
</html>
