<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>AuraLOA | CRM Enterprise</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
        :root { --gold: #D4AF37; --bg: #050505; --surface: #111111; --border: #222; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: #fff; margin: 0; display: flex; }
        aside { width: 260px; height: 100vh; background: #000; border-right: 1px solid var(--border); padding: 40px 20px; }
        main { flex: 1; padding: 40px; }
        .card { background: var(--surface); border: 1px solid var(--border); padding: 20px; border-radius: 12px; cursor: pointer; transition: 0.3s; margin-bottom: 10px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; }
        .modal-content { background: var(--surface); padding: 40px; border-radius: 16px; width: 400px; border: 1px solid var(--gold); }
        input { width: 100%; background: #000; border: 1px solid var(--border); color: #fff; padding: 12px; margin: 10px 0; border-radius: 6px; }
    </style>
</head>
<body>

<aside><div style="color:var(--gold); font-weight:600;">AURATECH CRM</div></aside>

<main id="pipeline-container">
    </main>

<div id="modal" class="modal">
    <div class="modal-content">
        <h3>Editar Precatório</h3>
        <input type="text" id="editName" placeholder="Nome do Cliente">
        <input type="text" id="editValue" placeholder="Valor">
        <button onclick="saveChanges()" style="background:var(--gold); border:none; padding:12px 20px; border-radius:6px; cursor:pointer;">Salvar</button>
    </div>
</div>

<script>
    // Dados fixos (sem necessidade de ler arquivos externos)
    const dadosCRM = [
        { id: "1", nome: "JARDEL ROMULO", valor: "R$ 569.022.567" },
        { id: "2", nome: "OTAVIO SOUZA", valor: "R$ 25.122.248" },
        { id: "3", nome: "DANIEL DO NASCIMENTO", valor: "R$ 11.345.611" }
    ];

    const container = document.getElementById('pipeline-container');
    dadosCRM.forEach(item => {
        container.innerHTML += `
            <div id="card${item.id}" class="card" onclick="openModal('${item.id}')">
                <h4 id="name${item.id}">${item.nome}</h4>
                <p id="value${item.id}" style="color:var(--gold);">${item.valor}</p>
            </div>
        `;
    });

    let currentId = "";
    function openModal(id) {
        currentId = id;
        document.getElementById('editName').value = document.getElementById('name'+id).innerText;
        document.getElementById('editValue').value = document.getElementById('value'+id).innerText;
        document.getElementById('modal').style.display = 'flex';
    }

    function saveChanges() {
        document.getElementById('name'+currentId).innerText = document.getElementById('editName').value;
        document.getElementById('value'+currentId).innerText = document.getElementById('editValue').value;
        document.getElementById('modal').style.display = 'none';
    }
</script>
</body>
</html>
