<script>
    // Base de dados carregada diretamente no código (sem arquivos externos)
    const dadosCRM = [
        { "Nº Precatorio": "5000792-60.2025.4.02.9388", "Valor (R$)": "569.022.567", "Advogado": "JARDEL ROMULO" },
        { "Nº Precatorio": "0816391-59.2025.8.14.0000", "Valor (R$)": "25.122.248", "Advogado": "OTAVIO SOUZA" },
        { "Nº Precatorio": "0287409-48.2024.8.26.0500", "Valor (R$)": "11.345.611", "Advogado": "DANIEL DO NASCIMENTO" },
        { "Nº Precatorio": "0817467-21.2025.8.14.0000", "Valor (R$)": "8.021.953", "Advogado": "PENDENTE" }
    ];

    function carregarDadosCRM() {
        const container = document.getElementById('pipeline-container');
        if (!container) return;
        
        container.innerHTML = ''; 
        dadosCRM.forEach(item => {
            container.innerHTML += `
                <div class="card" onclick="openModal('${item['Nº Precatorio']}', '${item['Valor (R$)']}')">
                    <h4>${item['Advogado']}</h4>
                    <p style="color:var(--gold);">R$ ${item['Valor (R$)']}</p>
                </div>
            `;
        });
    }

    window.onload = carregarDadosCRM;
</script>
